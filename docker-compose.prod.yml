services:
  aplyko-db:
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD_PROD}
      POSTGRES_DB: ${PG_DB_NAME}

  aplyko-api:
    build:
      context: .
      dockerfile: ./AplykoApi/Dockerfile.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__default=Host=aplyko-db;Database=PersonDb;Username=${PG_USER};Password=${PG_PASSWORD_PROD}
