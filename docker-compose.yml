services:
  aplyko-db:
    image: postgres:18-alpine
    container_name: aplyko-db
    restart: always
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  aplyko-api:
    ports:
      - ${API_PORT}:${API_PORT}
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:${API_PORT}
    depends_on:
      aplyko-db:
        condition: service_healthy
        restart: true
    volumes:
      - ./AplykoApi:/source/AplykoApi
      - /source/AplykoApi/bin
      - /source/AplykoApi/obj

volumes:
  pg-data: