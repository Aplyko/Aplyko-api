services:
  aplyko-db:
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD_DEV}
      POSTGRES_DB: ${PG_DB_NAME}

  aplyko-api:
    build:
      context: .
      dockerfile: ./AplykoApi/Dockerfile.dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__connPostgres=Host=aplyko-db;Database=${PG_DB_NAME};Username=${PG_USER};Password=${PG_PASSWORD_DEV}